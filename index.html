.cm *{box-sizing:border-box;margin:0;padding:0}
.cm{
  --jean:#3d8bfd; --jean-soft:rgba(61,139,253,.14);
  --lulu:#ef88b3; --lulu-soft:rgba(239,136,179,.16);
  --gold:#e6b23e; --gold-soft:rgba(230,178,62,.16);
  --st-want:#8e8e93; --st-watching:#e0a94f; --st-seen:#57b894; --st-nope:#c96b6b;
  --fav-a:#5aa0ff; --fav-b:#f48fbd;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
  min-height:100vh;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;
}
.cm[data-theme="dark"]{--bg:#0a0a0c;--surface:#151518;--surface-2:#1e1e23;--surface-3:#26262c;--text:#f4f4f6;--dim:#9a9aa4;--faint:#68686f;--border:rgba(255,255,255,.09);--border-2:rgba(255,255,255,.14);--shadow:0 12px 40px rgba(0,0,0,.5)}
.cm[data-theme="light"]{--bg:#f4ecd8;--surface:#fbf5e7;--surface-2:#efe6cf;--surface-3:#e6dbbf;--text:#2b271f;--dim:#7c7360;--faint:#a89e85;--border:rgba(60,48,20,.13);--border-2:rgba(60,48,20,.22);--shadow:0 12px 40px rgba(70,55,20,.14)}
.cm button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.cm input,.cm textarea,.cm select{font-family:inherit;color:inherit}
.cm :focus-visible{outline:2px solid var(--jean);outline-offset:2px;border-radius:8px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 150px}

/* header plain (sem capa) */
.hdr{max-width:1180px;margin:0 auto;padding:22px 20px 8px;display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:12px}
.pop{line-height:1}
.title{font-weight:680;letter-spacing:-.025em}
.sub{font-size:13px;color:var(--dim);margin-top:3px;font-weight:500;text-align:left}
.sub b{color:var(--text);font-weight:700}
.hdr .title{font-size:25px;color:var(--text)}
.hdr .pop{font-size:30px}
.hbtns{display:flex;gap:8px;flex:0 0 auto}
.hbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;transition:.15s}
.hbtn:hover{background:var(--surface-2)}

/* header com capa */
.banner{position:relative;height:190px;overflow:hidden}
@media(max-width:600px){.banner{height:150px}}
.banner-img{position:absolute;inset:0;background-repeat:no-repeat}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.82) 0%,rgba(0,0,0,.2) 55%,rgba(0,0,0,.35) 100%)}
.banner-in{position:relative;z-index:2;max-width:1180px;margin:0 auto;height:100%;padding:20px;display:flex;align-items:flex-end;justify-content:space-between}
.banner .title{font-size:27px;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.6)}
@media(max-width:600px){.banner .title{font-size:21px}.banner .pop{font-size:26px}}
.banner .pop{font-size:34px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
.banner .sub{color:rgba(255,255,255,.92);text-shadow:0 1px 8px rgba(0,0,0,.6)}
.banner .sub b{color:#fff}
.gbtn{width:38px;height:38px;border-radius:12px;background:rgba(0,0,0,.4);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);color:#fff;display:grid;place-items:center;transition:.15s}
.gbtn:hover{background:rgba(0,0,0,.6)}
.banner-btns{display:flex;gap:8px;align-self:flex-start}

/* avatars */
.av{border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;overflow:hidden;flex:0 0 auto}
.av img{width:100%;height:100%;object-fit:cover}
.av.j{background:var(--jean)} .av.l{background:var(--lulu)}

/* suggestion */
.sug{margin:16px 0 4px;border:1px solid var(--border);border-radius:18px;background:var(--surface);padding:14px 16px;box-shadow:var(--shadow)}
.sug-top{display:flex;align-items:center;gap:14px}
.sug-eyebrow{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:650}
.sug-title{font-size:16px;font-weight:640;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sug-meta{font-size:12px;color:var(--dim);margin-top:1px}
.sug-actions{display:flex;gap:8px;margin-left:auto;flex:0 0 auto}
.mini-btn{border:1px solid var(--border);background:var(--surface-2);border-radius:11px;padding:8px 13px;font-size:13px;font-weight:560;display:flex;align-items:center;gap:6px;transition:.15s}
.mini-btn:hover{background:var(--surface-3)}
.mini-btn.solid{background:var(--jean);color:#fff;border-color:transparent}
.sug-x{color:var(--faint);padding:6px;border-radius:9px}.sug-x:hover{color:var(--text);background:var(--surface-2)}
.moods{display:flex;gap:7px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.moods::-webkit-scrollbar{display:none}
.mood{white-space:nowrap;border:1px solid var(--border);background:var(--surface-2);border-radius:99px;padding:6px 13px;font-size:12.5px;font-weight:540;color:var(--dim);display:flex;align-items:center;gap:6px;transition:.14s;flex:0 0 auto}
.mood:hover{border-color:var(--border-2);color:var(--text)}

/* toolbar */
.tb{position:sticky;top:0;z-index:15;background:var(--bg);padding:14px 0 8px}
.tb[data-scrolled="true"]{background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(18px)}
.tb-inner{max-width:1180px;margin:0 auto;padding:0 20px}
.tb-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px}
.tab{padding:7px 15px;border-radius:9px;font-size:13.5px;font-weight:560;color:var(--dim);display:flex;align-items:center;gap:6px;transition:.15s}
.tab[data-on="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.search{flex:1;min-width:170px;display:flex;align-items:center;gap:9px;background:var(--surface-2);border:1px solid transparent;border-radius:12px;padding:0 13px;height:40px}
.search:focus-within{border-color:var(--border-2);background:var(--surface)}
.search input{flex:1;background:none;border:none;font-size:14.5px;outline:none}
.search input::placeholder{color:var(--faint)}
.icobtn{height:40px;min-width:40px;padding:0 10px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);display:flex;align-items:center;gap:6px;justify-content:center;flex:0 0 auto;transition:.15s;font-size:13px;font-weight:540}
.icobtn:hover{background:var(--surface-3)}
.icobtn[data-on="true"]{border-color:var(--jean);color:var(--jean)}
.chips{display:flex;gap:7px;margin-top:11px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--border);background:var(--surface);border-radius:99px;padding:6px 13px;font-size:12.5px;font-weight:530;color:var(--dim);display:flex;align-items:center;gap:7px;transition:.14s;flex:0 0 auto}
.chip:hover{border-color:var(--border-2)}
.chip[data-on="true"]{background:var(--text);color:var(--bg);border-color:transparent}
.chip .dot{width:7px;height:7px;border-radius:99px}
.chip .cnt{font-size:11px;opacity:.6}
.chip.fav[data-on="true"]{background:linear-gradient(90deg,var(--fav-a),var(--fav-b));color:#fff}
.chip.anim[data-on="true"]{background:var(--gold);color:#1a1508;border-color:transparent}
.adv{margin-top:11px;display:flex;gap:9px;flex-wrap:wrap;align-items:center;padding:12px 14px;border:1px solid var(--border);border-radius:14px;background:var(--surface)}
.adv label{font-size:11px;color:var(--faint);font-weight:650;text-transform:uppercase;letter-spacing:.05em}
.sel{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:8px 11px;font-size:13px;font-weight:520;cursor:pointer}
.adv .clear{margin-left:auto;font-size:12.5px;color:var(--jean);font-weight:560}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 15px;margin-top:22px}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,1fr);gap:16px 12px}}
.card{text-align:left;display:flex;flex-direction:column;gap:9px;animation:rise .4s both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.poster{position:relative;aspect-ratio:2/3;border-radius:15px;overflow:hidden;border:1px solid var(--border);box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s}
.card:hover .poster{transform:translateY(-4px);box-shadow:0 18px 44px rgba(0,0,0,.32)}
.poster img{width:100%;height:100%;object-fit:cover}
.ph{width:100%;height:100%;display:grid;place-items:center;position:relative}
.ph-ini{font-size:44px;font-weight:640;letter-spacing:-.03em;color:rgba(255,255,255,.92)}
.ph-plat{position:absolute;bottom:9px;left:9px;right:9px;font-size:10.5px;font-weight:650;color:rgba(255,255,255,.82);text-shadow:0 1px 3px rgba(0,0,0,.5)}
.p-status{position:absolute;top:9px;left:9px;width:10px;height:10px;border-radius:99px;box-shadow:0 0 0 3px rgba(0,0,0,.28)}
.p-fav{position:absolute;top:7px;right:7px;width:24px;height:24px;border-radius:99px;display:grid;place-items:center;background:rgba(0,0,0,.35);backdrop-filter:blur(4px)}
.p-leaving{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(201,107,107,.94));color:#fff;font-size:10px;font-weight:650;padding:16px 9px 7px;display:flex;align-items:center;gap:4px}
.who-av{position:absolute;bottom:8px;right:8px;display:flex}
.who-av .av{border:2px solid rgba(0,0,0,.3);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.who-av .av+.av{margin-left:-7px}
.c-title{font-size:13.5px;font-weight:580;line-height:1.25;letter-spacing:-.015em}
.c-sub{font-size:11.5px;color:var(--dim);display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:2px}
.c-add{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--faint);margin-top:5px}
.rate-mini{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
.rp{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:680;padding:2px 6px;border-radius:7px}
.rp.g{background:var(--gold-soft);color:var(--gold)} .rp.j{background:var(--jean-soft);color:var(--jean)} .rp.l{background:var(--lulu-soft);color:var(--lulu)}
.empty{grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--dim)}
.empty h3{font-size:16px;color:var(--text);font-weight:640;margin-bottom:6px}

/* fabs */
.fabs{position:fixed;right:22px;bottom:24px;z-index:30;display:flex;flex-direction:column;gap:12px;align-items:center}
.fab{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;box-shadow:0 8px 26px rgba(0,0,0,.32);transition:.16s}
.fab:hover{transform:translateY(-2px)}
.fab.add{background:var(--jean);color:#fff}
.fab.rol{width:48px;height:48px;border-radius:15px;background:var(--surface);border:1px solid var(--border-2);color:var(--text)}

/* modal */
.ov{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@media(min-width:640px){.ov{align-items:center}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:24px 24px 0 0;box-shadow:var(--shadow);animation:up .28s cubic-bezier(.2,.8,.2,1)}
@media(min-width:640px){.sheet{border-radius:24px}}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet-hd{position:sticky;top:0;background:var(--surface);display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border);z-index:2}
.sheet-hd h2{font-size:16px;font-weight:640;display:flex;align-items:center;gap:8px}
.closeb{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center}
.closeb:hover{background:var(--surface-3)}
.sheet-bd{padding:18px}

/* detail */
.d-hero{display:flex;gap:16px}
.d-poster{width:150px;flex:0 0 auto;aspect-ratio:2/3;border-radius:14px;overflow:hidden;border:1px solid var(--border);box-shadow:var(--shadow)}
@media(min-width:520px){.d-poster{width:172px}}
.d-poster img{width:100%;height:100%;object-fit:cover}
.d-h-info{flex:1;min-width:0}
.d-title{font-size:20px;font-weight:680;line-height:1.15;letter-spacing:-.02em}
.d-credits{font-size:12.5px;color:var(--dim);margin-top:5px;display:flex;gap:10px;flex-wrap:wrap}
.d-credits span{display:flex;align-items:center;gap:4px}
.d-syn{font-size:12.5px;line-height:1.5;color:var(--dim);margin-top:9px}
.d-badges{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.bdg{font-size:11.5px;font-weight:560;padding:5px 10px;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;gap:5px}
.st-bdg{color:#fff}
.d-sec{margin-top:20px}
.d-lab{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:680;margin-bottom:9px}
.d-note{font-size:14.5px;line-height:1.5;background:var(--surface-2);border-radius:13px;padding:13px 15px}
.rate-row{display:flex;flex-direction:column;gap:11px}
.rate-line{display:flex;align-items:center;gap:11px}
.rate-name{width:52px;font-size:13px;font-weight:640}
.rate-name.g{color:var(--gold)} .rate-name.j{color:var(--jean)} .rate-name.l{color:var(--lulu)}
.stars{display:flex;gap:3px}.star{padding:2px}
.d-who{display:flex;gap:9px}
.who-pill{font-size:12.5px;font-weight:560;padding:7px 12px;border-radius:99px;border:1px solid var(--border);display:flex;align-items:center;gap:7px}
.d-add{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim);font-weight:500}
.d-actions{display:flex;gap:10px;margin-top:24px}
.btn{flex:1;border-radius:13px;padding:12px;font-size:14px;font-weight:640;display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s}
.btn.primary{background:var(--jean);color:#fff}.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:var(--surface-2);border:1px solid var(--border)}.btn.ghost:hover{background:var(--surface-3)}
.d-fav{width:48px;height:48px;flex:0 0 auto;border-radius:13px;border:1px solid var(--border);background:var(--surface-2);display:grid;place-items:center}
.d-fav[data-on="true"]{border-color:transparent;background:linear-gradient(135deg,var(--fav-a),var(--fav-b))}

/* form */
.fld{margin-bottom:15px}
.fld label{display:block;font-size:12px;font-weight:640;color:var(--dim);margin-bottom:6px}
.hint{font-size:11px;color:var(--faint);margin-top:6px}
.in{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:11px 13px;font-size:14.5px;transition:.15s}
.in:focus{border-color:var(--jean);background:var(--surface);outline:none}
textarea.in{resize:vertical;min-height:60px;line-height:1.45}
.two{display:flex;gap:11px}.two>*{flex:1}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--border);background:var(--surface-2);border-radius:10px;padding:9px 12px;font-size:12.5px;font-weight:560;color:var(--dim);transition:.14s;display:flex;align-items:center;gap:6px}
.seg button[data-on="true"]{color:var(--text);border-color:var(--text)}
.seg button.j[data-on="true"]{border-color:var(--jean);color:var(--jean);background:var(--jean-soft)}
.seg button.l[data-on="true"]{border-color:var(--lulu);color:var(--lulu);background:var(--lulu-soft)}
.whoseg button[data-on="true"]{background:var(--text);color:var(--bg);border-color:transparent}
.plats{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.plat{border:1px solid var(--border);background:var(--surface-2);border-radius:99px;padding:6px 12px;font-size:12px;font-weight:540;color:var(--dim)}
.plat[data-on="true"]{background:var(--text);color:var(--bg);border-color:transparent}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{border:1px dashed var(--border-2);border-radius:8px;padding:5px 10px;font-size:12px;color:var(--dim)}
.tag:hover{color:var(--text);border-style:solid}
.form-fav{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2)}
.form-fav .hb{width:34px;height:34px;border-radius:99px;border:1px solid var(--border);display:grid;place-items:center}
.form-fav .hb[data-on="true"]{border-color:transparent;background:linear-gradient(135deg,var(--fav-a),var(--fav-b))}
.cover-box{display:flex;gap:12px;align-items:flex-start}
.cover-prev{width:74px;height:110px;flex:0 0 auto;border-radius:10px;overflow:hidden;border:1px solid var(--border);background:var(--surface-2)}
.cover-prev img{width:100%;height:100%;object-fit:cover}
.cover-opts{flex:1}
.upl{display:flex;align-items:center;gap:8px;justify-content:center;border:1px dashed var(--border-2);border-radius:11px;padding:11px;font-size:13px;font-weight:560;color:var(--dim);width:100%}
.upl:hover{color:var(--text);border-color:var(--jean)}
.or{text-align:center;font-size:11px;color:var(--faint);margin:8px 0}

/* personalize */
.pz-sec{margin-bottom:22px}
.crop{position:relative;height:130px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface-2);cursor:grab;touch-action:none}
.crop:active{cursor:grabbing}
.crop-img{position:absolute;inset:0;background-repeat:no-repeat}
.crop-hint{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);font-size:12px;pointer-events:none}
.crop-lab{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:10px 12px;background:linear-gradient(transparent,rgba(0,0,0,.55));display:flex;align-items:flex-end;gap:8px}
.crop-lab .title{font-size:15px;color:#fff}.crop-lab .pop{font-size:19px}
.zoom-row{display:flex;align-items:center;gap:10px;margin-top:10px}
.zoom-row input[type=range]{flex:1;accent-color:var(--jean)}
.av-pick{display:flex;gap:14px}
.av-slot{flex:1;text-align:center}
.av-slot .big-av{width:76px;height:76px;margin:0 auto 8px;border:3px solid;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-size:26px;font-weight:800;color:#fff;position:relative}
.av-slot.j .big-av{border-color:var(--jean);background:var(--jean)} .av-slot.l .big-av{border-color:var(--lulu);background:var(--lulu)}
.av-slot .big-av img{width:100%;height:100%;object-fit:cover}
.av-slot .lbl{font-size:12.5px;font-weight:600;margin-bottom:8px}
.av-up{font-size:12px;color:var(--dim);border:1px dashed var(--border-2);border-radius:9px;padding:7px 10px;display:inline-flex;align-items:center;gap:6px}
.av-up:hover{color:var(--text)}

/* roleta */
.rol-mode{display:flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:2px;margin:0 auto 14px;width:fit-content}
.rol-mode button{padding:7px 16px;border-radius:8px;font-size:13px;font-weight:560;color:var(--dim);display:flex;align-items:center;gap:6px}
.rol-mode button[data-on="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.rol-filters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:4px 0}
.rol-stage{text-align:center;padding:6px 4px 4px}
.rol-eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:680}
.rol-card{margin:14px auto;max-width:190px}
.rol-poster{aspect-ratio:2/3;border-radius:16px;overflow:hidden;border:1px solid var(--border);box-shadow:var(--shadow)}
.rol-t{font-size:18px;font-weight:680;margin-top:12px;min-height:24px}
.rol-m{font-size:13px;color:var(--dim);margin-top:3px;min-height:18px}
.spin{animation:sp .5s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
/* duelo */
.duelo{display:flex;gap:12px;align-items:stretch;margin:8px 0}
.dside{flex:1;border:1px solid var(--border);border-radius:16px;padding:12px;text-align:center;transition:.18s}
.dside.j{border-color:var(--jean-soft)} .dside.l{border-color:var(--lulu-soft)}
.dside .who-tag{font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:9px}
.dside.j .who-tag{color:var(--jean)} .dside.l .who-tag{color:var(--lulu)}
.dpick{aspect-ratio:2/3;border-radius:12px;overflow:hidden;border:1px dashed var(--border-2);display:grid;place-items:center;cursor:pointer;background:var(--surface-2)}
.dpick.filled{border-style:solid}
.dside.flash{transform:scale(1.05)}
.dside.j.flash{box-shadow:0 0 0 3px var(--jean),0 12px 30px rgba(61,139,253,.4)}
.dside.l.flash{box-shadow:0 0 0 3px var(--lulu),0 12px 30px rgba(239,136,179,.4)}
.dside.champ{transform:scale(1.05)}
.dside.j.champ{box-shadow:0 0 0 3px var(--jean),0 14px 40px rgba(61,139,253,.5)}
.dside.l.champ{box-shadow:0 0 0 3px var(--lulu),0 14px 40px rgba(239,136,179,.5)}
.dtitle{font-size:12.5px;font-weight:600;margin-top:8px;min-height:16px}
.dvs{align-self:center;font-size:14px;font-weight:800;color:var(--faint)}
.champ-banner{text-align:center;font-size:15px;font-weight:700;margin:6px 0 0;min-height:22px;display:flex;align-items:center;justify-content:center;gap:8px}

/* picker */
.pick-list{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.pick-item{text-align:left}
.pick-item .rol-poster{aspect-ratio:2/3;border-radius:11px}
.pick-item .pt{font-size:11px;font-weight:560;margin-top:5px;line-height:1.2}

/* stats */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.stat{background:var(--surface-2);border-radius:14px;padding:15px}
.stat-n{font-size:26px;font-weight:760;letter-spacing:-.03em}
.stat-l{font-size:12px;color:var(--dim);margin-top:2px}
.stat.wide{grid-column:1/-1}.stat-n.j{color:var(--jean)}.stat-n.l{color:var(--lulu)}
.crop-circle{width:108px;height:108px;border-radius:50%;overflow:hidden;border:3px solid var(--jean);position:relative;cursor:grab;touch-action:none;margin:0 auto;display:grid;place-items:center}
.crop-circle:active{cursor:grabbing}
.crop-circle .crop-img{position:absolute;inset:0;background-repeat:no-repeat}
.confetti{position:fixed;inset:0;z-index:70;pointer-events:none;overflow:hidden}
.conf{position:absolute;top:-30px;animation:fall 1.4s ease-in forwards}
@keyframes fall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(112vh) rotate(400deg);opacity:.85}}
